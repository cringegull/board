<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Клеточная доска</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#080c09;--card:#0f1d16;--ink:#e2eee6;--mute:#86a392;--line:#1d3a2b;--acc:#2f9e5b;--cell:#112419;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
main{max-width:900px;margin:0 auto;padding:12px 10px 40px}
h1{font-size:20px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.badge{font-size:13px;padding:3px 9px;border-radius:12px;background:var(--acc);color:#fff}
.banner{font-size:13px;color:var(--mute);border:1px dashed var(--line);border-radius:6px;padding:6px 9px;margin-bottom:8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.hint{color:var(--mute);font-size:14px;margin:0 0 8px}
.gb{overflow:auto;border-radius:6px}
.grid{display:grid;width:max-content;min-width:100%}
.c{aspect-ratio:1;padding:0;border:1px solid var(--line);border-radius:0;background:var(--cell);display:flex;align-items:center;justify-content:center;min-width:0}
.c.off{visibility:hidden;border:0}
.cells .c.off{visibility:visible;background:transparent;border:1px dashed var(--line)}
.p{width:84%;height:84%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,3.4vw,20px);color:#fff;border:2px solid rgba(255,255,255,.7);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.p.me{outline:2px solid var(--acc);outline-offset:1px}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:18}#bd.show{display:block}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(300px,86vw);background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:19;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));overflow:auto}
#dr.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dr{display:flex;align-items:center;gap:8px;padding:7px;margin-bottom:4px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--bg)}
.dr .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr b{min-width:34px;text-align:center;color:var(--acc)}
#dr .dr input{width:62px;padding:5px}
.mut{color:var(--mute);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sh{background:var(--card);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 8px;font-size:18px}
.sh h4{margin:12px 0 4px;font-size:14px;color:var(--acc)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
input[type=text],input[type=number]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.r2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rw{margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.pr{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:5px;margin-bottom:4px;align-items:center}
.pr label{margin:0;font-size:12px;display:flex;align-items:center;gap:3px}
.ex{display:flex;gap:5px}.ex label{flex:1;margin:0;font-size:11px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:240px;margin:4px 0 8px}
.slot{border:1px solid var(--line);border-radius:6px;text-align:center;padding:2px;background:var(--bg)}
.slot span{display:block;font-size:11px;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv b{text-align:right;font-weight:600}
.btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{display:flex;gap:5px;overflow-x:auto;margin-bottom:8px}.pill button{flex:none;padding:4px 10px}
#cm{height:46vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--bg);margin-bottom:8px}
.m{margin-bottom:6px}.m small{color:var(--mute)}.m.me{text-align:right}
.snd{display:flex;gap:6px}.snd input{flex:1}
#tt{position:fixed;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;padding:10px 12px;border-radius:8px;z-index:40;display:none}
.p.dg{touch-action:none;cursor:grab}.p.turn{box-shadow:0 0 0 3px #e0b020}.c.reach{background:rgba(224,176,32,.35)}
select{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.c{position:relative}.it{position:absolute;right:1px;bottom:0;font-size:11px;line-height:1}.it:only-child{position:static;font-size:clamp(12px,3.4vw,20px)}
.sg3{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}.sg3.six{grid-template-columns:repeat(3,1fr)}.sg3 b{font-size:14px}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:14px}.sk span{display:flex;justify-content:space-between;gap:6px}
.tpn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:8px}.tpn summary{cursor:pointer}.tr{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:6px}
textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.kv b{max-width:58%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.kv[data-n]{cursor:pointer}
#fx{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:30}#fx.show{display:flex}
.pr{grid-template-columns:1fr 1.4fr auto auto auto}
.dng{border-color:#d9534f;color:#ff7b77}
</style></head>
<body><main>
<div class="top"><h1>Клеточная доска</h1><span class="badge" id="role">…</span></div>
<div class="banner" id="demo" hidden>Демо-режим: данные не сохраняются. В опубликованной версии включается общая база.</div>
<div id="boardv"><p class="hint" id="st" style="color:var(--acc);margin-bottom:2px"></p><p class="hint" id="hint"></p>
<div id="tp"></div><div class="gb"><div class="grid" id="grid"></div></div><div class="bar" id="bar" style="margin-top:10px"></div></div><div id="menu" hidden></div>
</main>
<div id="bd" onclick="setDr(false)"></div>
<aside id="dr"><div class="dh"><b>Инициатива</b><button onclick="setDr(false)">✕</button></div><div id="pl"></div></aside>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div id="fx" onclick="if(event.target===this)closeFx()"></div><div id="tt"></div>
<div id="fbgate" style="display:none;position:fixed;inset:0;z-index:100;background:#080c09;color:#e2eee6;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:17px Georgia,serif;text-align:center;padding:20px"><div style="font-size:22px">Клеточная доска</div><button id="fbbtn" style="padding:10px 20px;font:inherit;border-radius:8px;border:1px solid #2f9e5b;background:#2f9e5b;color:#fff">Войти через Google</button><div id="fbmsg" style="color:#ff7b77;font-size:14px;max-width:320px"></div></div>
<script src="config.js"></script>
<script>
(function(){
const B='https://www.gstatic.com/firebasejs/10.14.1/',$=id=>document.getElementById(id);let doLogin=()=>{};
const fb=(async()=>{
  const c=window.FIREBASE_CONFIG;
  if(!c||!c.apiKey||c.apiKey==='ВСТАВЬТЕ'){$('fbgate').style.display='flex';$('fbbtn').style.display='none';$('fbmsg').textContent='Не заполнен файл config.js';return null}
  const [A,F,Au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
  const app=A.initializeApp(c),fdb=F.initializeFirestore(app,{ignoreUndefinedProperties:true}),auth=Au.getAuth(app);
  doLogin=()=>Au.signInWithPopup(auth,new Au.GoogleAuthProvider()).catch(e=>{$('fbmsg').textContent='Ошибка входа: '+e.code});
  const user=await new Promise(res=>{let done=0;Au.onAuthStateChanged(auth,u=>{if(u&&!done){done=1;$('fbgate').style.display='none';res(u)}else if(!u)$('fbgate').style.display='flex'})});
  const em=(user.email||'').toLowerCase(),adm=(window.ADMIN_EMAIL||'').toLowerCase();
  const deny=()=>{$('fbgate').style.display='flex';$('fbbtn').style.display='none';$('fbmsg').textContent='Нет доступа. Попросите ведущего добавить вашу почту: '+em};
  const db={collection:n=>({onSnapshot:(cb,er)=>F.onSnapshot((n==='chat'||n==='log')?F.query(F.collection(fdb,n),F.orderBy('t','desc'),F.limit(150)):F.collection(fdb,n),cb,e=>{deny();if(er)er(e)})}),
    doc:p=>({set:d=>F.setDoc(F.doc(fdb,p),d),delete:()=>F.deleteDoc(F.doc(fdb,p))})};
  const u={isOwner:async()=>em===adm,id:async()=>user.uid,me:async()=>({name:user.displayName||user.email})};
  return{db,u}})();
$('fbbtn').onclick=()=>doLogin();
window.claude={use:async n=>{const x=await fb;return x?(n==='db'?x.db:n==='user'?x.u:null):null}};
})();
</script>
<script>
const SEC={params:'Параметры',abil:'Способности',spells:'Заклинания',inv:'Инвентарь'};
const secs=col=>col==='players'?['params','abil','spells','inv']:['params','abil'];
let tool=null,E=null,db=null,isOwner=false,myId=null,realOwner=false,realId=null,testing=null,myName='Игрок',demo=true,cfg={w:10,h:10,off:[]};
const S={pieces:{},players:{},stats:{},secrets:{},board:{},log:{},members:{},chat:{},items:{},turn:{},roster:{},sess:{}};let chatOpen=false,chatTo='all',ed=null,LD={},tried={},clearing=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=()=>[...Object.entries(S.pieces).map(([id,d])=>({col:'pieces',id,...d})),...Object.entries(S.players).map(([id,d])=>({col:'players',id,...d}))];
const isOn=(x,y)=>x<cfg.w&&y<cfg.h&&!cfg.off.includes(x+','+y);
const canEdit=p=>isOwner||(p.col==='players'&&p.id===myId);
const colOf=id=>S.pieces[id]?'pieces':'players';
const clone=o=>JSON.parse(JSON.stringify(o));
async function put(col,id,d){S[col][id]=d;if(col==='board'&&id==='cfg')cfg={w:d.w,h:d.h,off:d.off||[]};render();if(isOwner&&(col==='stats'||col==='players'))rosterQ(id);if(db){try{await db.doc(col+'/'+id).set(d)}catch(e){toast('Нет прав на запись: '+(e.message||e.code))}}}
async function rm(col,id){const cs=[col];if(isOwner)cs.push('stats','secrets');cs.forEach(c=>delete S[c][id]);render();if(db)for(const c of cs){try{await db.doc(c+'/'+id).delete()}catch(e){}}}
function sub(col){db.collection(col).onSnapshot(s=>{S[col]={};s.docs.forEach(d=>S[col][d.id]=d.data());if(col==='board'&&S.board.cfg){const b=S.board.cfg;cfg={w:b.w,h:b.h,off:b.off||[]}}LD[col]=1;if(col==='chat')chatNotify();else render();restoreStats()},()=>{})}
function setDr(v){$('dr').classList.toggle('open',v);$('bd').classList.toggle('show',v)}
function render(){render0();if(chatOpen||menuOn())renderChat()}
function render0(){
  $('role').textContent=testing?'Тест: '+((S.players[testing]||{}).name||''):isOwner?'Админ':(myId?'Игрок':'Гость');$('demo').hidden=!demo;{const mo=menuOn(),m=$('menu');$('boardv').hidden=mo;m.hidden=!mo;if(mo){renderMenu();return}if(m.dataset.init){m.innerHTML='';delete m.dataset.init}}$('st').textContent=turnLabel();renderTP();
  const ps=all();let b=`<button onclick="setDr(true)">Список (${ps.length})</button><button onclick="showLog()">Журнал</button><button onclick="showChat()">Чаты${unTot()?' ('+unTot()+')':''}</button>${isOwner?`<button onclick="nextTurn()">Ход ▶</button><button class="${tool==='item'?'on':''}" onclick="setTool('item')">＋ Предмет</button><button class="${tool==='pl'?'on':''}" onclick="setTool('pl')">＋ Тест-игрок</button><button onclick="showRoster()">База игроков</button><button class="dng" onclick="clearBoard()">Очистить доску</button><button class="dng" onclick="exitBoard()">Выйти</button>`:''}`;
  if(isOwner)b+=`<button class="${tool==='piece'?'on':''}" onclick="setTool('piece')">＋ Фишка</button><button class="${tool==='cells'?'on':''}" onclick="boardEd()">Доска</button>`;
  if((myId||demo)&&!S.players[myId||'demo'])b+=`<button class="${tool==='me'?'on':''}" onclick="setTool('me')">${S.players[myId||'demo']?'Моя фишка: переместить':'＋ Моя фишка'}</button>`;
  if(realOwner)b+=`<button class="${testing?'on':''}" onclick="testMode()">${testing?'Выйти из теста':'Режим игрока'}</button>`;$('bar').innerHTML=b;
  $('hint').textContent=tool==='cells'?'Нажимайте клетки, чтобы убрать или вернуть. Кнопка «Доска» — выход.':tool?'Нажмите на пустую клетку.':'Нажмите на фишку, чтобы узнать данные.';
  let g='';
  for(let y=0;y<cfg.h;y++)for(let x=0;x<cfg.w;x++){
    if(!isOn(x,y)){g+=`<button class="c off" data-x="${x}" data-y="${y}"></button>`;continue}
    const p=ps.find(q=>q.x==x&&q.y==y);
    g+=`<button class="c" data-x="${x}" data-y="${y}">${p?`<span class="p${p.col==='players'&&p.id===myId?' me':''}${canDrag(p)?' dg':''}${p.id===trn().id?' turn':''}" style="background:${esc(p.color||'#8c2f39')}">${esc(p.emoji||(p.name||'?')[0])}</span>`:''}${itemMark(x,y)}</button>`}
  const gr=$('grid');gr.className='grid'+(tool==='cells'?' cells':'');gr.style.gridTemplateColumns=`repeat(${cfg.w},minmax(24px,1fr))`;gr.innerHTML=g;
  const ini=p=>(S.stats[p.id]||{}).ini;
  const ls=ord();
  $('pl').innerHTML=ls.length?ls.map(p=>`<div class="dr" onclick="showP('${p.col}','${esc(p.id)}')">${isOwner?`<input type="number" placeholder="иниц." value="${ini(p)??''}" onclick="event.stopPropagation()" onchange="setIni('${esc(p.id)}',this.value)">`:`<b>${ini(p)??'—'}</b>`}<span class="n">${p.id===trn().id?'▶ ':''}${esc(p.emoji||'')} ${esc(p.name)}</span></div>`).join(''):'<span class="mut">Фишек пока нет.</span>';
}
function setIni(id,v){const st=clone(S.stats[id]||{sec:{}});st.ini=v===''?null:+v;put('stats',id,st)}
function setTool(t){tool=tool===t?null:t;render()}
$('grid').onclick=e=>{const c=e.target.closest('.c');if(!c)return;const x=+c.dataset.x,y=+c.dataset.y,k=x+','+y;
  if(tool==='cells'){const o=cfg.off.includes(k)?cfg.off.filter(v=>v!==k):[...cfg.off,k];put('board','cfg',{w:cfg.w,h:cfg.h,off:o});return}
  if(!isOn(x,y))return;
  const p=all().find(q=>q.x==x&&q.y==y);
  if(tool==='item'&&isOwner){editItem(null,x,y);return}
  if(p){tool=null;showP(p.col,p.id);return}
  if(!tool&&itemsAt(x,y).length){showCell(x,y);return}
  if(tool==='piece')edit('pieces',null,x,y);else if(tool==='me')edit('players',myId||'demo',x,y);else if(tool==='pl'&&isOwner){edit('players','t'+Date.now().toString(36),x,y);E.test=true}};
const openS=h=>{chatOpen=false;ed=null;$('sh').innerHTML=h;$('ov').classList.add('show')};
const closeS=()=>{flushAuto();chatOpen=false;ed=null;$('ov').classList.remove('show')};
$('ov').onclick=e=>{if(e.target===$('ov'))closeS()};
function boardEd(){
  if(tool==='cells'){tool=null;render();return}
  openS(`<h3>Доска</h3><div class="r2" style="grid-template-columns:1fr 1fr"><label>Ширина (1–30)<input type="number" id="b-w" min="1" max="30" value="${cfg.w}" onchange="applyB(1)"></label><label>Высота (1–30)<input type="number" id="b-h" min="1" max="30" value="${cfg.h}" onchange="applyB(1)"></label></div>
  <div class="btns"><button class="on" onclick="applyB()">Применить размер</button><button onclick="tool='cells';closeS();render()">Убирать клетки</button><button onclick="put('board','cfg',{w:cfg.w,h:cfg.h,off:[]});closeS()">Вернуть все клетки</button><button onclick="closeS()">Закрыть</button></div>`);
}
function applyB(auto){const c=v=>Math.min(30,Math.max(1,parseInt(v)||1));const w=c($('b-w').value),h=c($('b-h').value);
  put('board','cfg',{w,h,off:cfg.off.filter(k=>{const[a,b]=k.split(',');return a<w&&b<h})});if(!auto)closeS()}
function slotsHTML(st){const a=st.sl||[],m=st.slm||[];return '<div class="sg">'+[...Array(9)].map((_,i)=>`<div class="slot"><span>${i+1} круг</span><b>${a[i]||0}/${m[i]||0}</b></div>`).join('')+'</div>'}
function itemHTML(id,k,i,s,x){
  const meta=k==='abil'?`использовано ${i.u||0}${i.m?' из '+i.m:''}`+(actKey(i)?' · '+AL[actKey(i)]:''):k==='spells'?[i.lvl?i.lvl+' круг':'заговор',AL[actKey(i,1)],i.rng&&'дальность: '+i.rng,i.dur&&'длительность: '+i.dur].filter(Boolean).join(' · '):'';
  const q=`'${esc(id)}',${s},${x}`;
  const btn=isOwner?(k==='abil'?`<button onclick="useAb(${q},1)">＋1</button><button onclick="useAb(${q},0)">Сброс</button>`:k==='spells'?`<button onclick="useSp(${q})">Применить</button>`:''):'';
  return `<div class="kv" data-n="${esc(i.n)}" data-v="${esc(i.v)}" onclick="fullView(this)"><span>${esc(i.n)}${s?' <span class="mut">(скрыто)</span>':''}${meta?`<br><span class="mut">${esc(meta)}</span>`:''}</span><b>${esc(i.v)}</b></div>${btn?`<div class="btns" style="margin:2px 0 6px">${btn}</div>`:''}`}
function useAb(id,s,x,inc){const c=s?'secrets':'stats';
  if(inc){const a0=S[c][id].sec.abil[x];if(a0.m>0&&(a0.u||0)>=a0.m){toast('Лимит использований исчерпан');return}if(!spend(id,actKey(a0)))return}
  const doc=clone(S[c][id]),a=doc.sec.abil[x];
  if(inc){a.u=(a.u||0)+1;roll(id,a)}else a.u=0;
  put(c,id,doc);showP(colOf(id),id)}
function useSp(id,s,x){const sp=S[s?'secrets':'stats'][id].sec.spells[x],l=sp.lvl||0;
  if(l>0&&((S.stats[id].sl||[])[l-1]||0)<=0){toast('Нет ячеек '+l+' круга');return}
  if(!spend(id,actKey(sp,1)))return;
  if(l>0){const st=clone(S.stats[id]);st.sl[l-1]--;put('stats',id,st)}
  roll(id,sp);showP(colOf(id),id)}
function showP(col,id){
  const d=S[col][id];if(!d)return;setDr(false);
  const st=S.stats[id]||{},pub=st.sec||{},pr=isOwner&&col==='pieces'?(S.secrets[id]||{}).sec||{}:{};
  let h=`<h3>${esc(d.emoji||'')} ${esc(d.name)}${st.ini!=null?` <span class="mut">· иниц. ${st.ini}</span>`:''}</h3>`,any=0;if(col==='players')h+=actHTML(id,st)+sheetHTML(st.sh);
  secs(col).forEach(k=>{const L=[...(pub[k]||[]).map((i,x)=>[i,0,x]),...(pr[k]||[]).map((i,x)=>[i,1,x])];
    if(!L.length)return;any=1;h+=`<h4>${SEC[k]}</h4>`+(k==='spells'?slotsHTML(st):'')+L.map(([i,s,x])=>itemHTML(id,k,i,s,x)).join('')});

function flushAuto(){if(!ed||!autoSave.p)return;autoSave.p=0;clearTimeout(autoSave.h);if(ed==='tok')saveE(1);else if(ed==='item')saveItem(1)}

function modUI(){const P=pb(+$('h-lvl').value||1);AB.forEach((_,i)=>{const m=md(+$('h-a'+i).value||10);$('h-m'+i).textContent=sg(m);$('h-v'+i).textContent=sg(m+($('h-s'+i).checked?P:0))})}
function rowFull(btn){const i=btn.closest('.pr').querySelectorAll('input[type=text]'),a=i[0],b=i[1],f=$('fx');
  f.innerHTML='<div class="sh"><h3>Полный текст</h3><label>Название<textarea id="fx-a" rows="2"></textarea></label><label>Описание<textarea id="fx-b" rows="10"></textarea></label><div class="btns"><button class="on" onclick="closeFx()">Готово</button></div></div>';
  $('fx-a').value=a.value;$('fx-b').value=b.value;
  [['fx-a',a],['fx-b',b]].forEach(([id,t])=>$(id).oninput=e=>{t.value=e.target.value;t.dispatchEvent(new Event('input',{bubbles:true}))});f.classList.add('show')}
const closeFx=()=>$('fx').classList.remove('show');
function fullView(el){const f=$('fx');f.innerHTML=`<div class="sh"><h3>${esc(el.dataset.n)}</h3><div style="white-space:pre-wrap">${esc(el.dataset.v)||'<span class="mut">Нет описания</span>'}</div><div class="btns"><button class="on" onclick="closeFx()">Закрыть</button></div></div>`;f.classList.add('show')}
function ask(t){return new Promise(r=>{const f=$('fx');f.innerHTML=`<div class="sh"><h3>${esc(t)}</h3><div class="btns"><button class="on" id="ask-y">Да</button><button id="ask-n">Нет</button></div></div>`;f.classList.add('show');$('ask-y').onclick=()=>{closeFx();r(true)};$('ask-n').onclick=()=>{closeFx();r(false)}})}
const rq={};
function rosterQ(id){clearTimeout(rq[id]);rq[id]=setTimeout(()=>syncRoster(id),900)}
async function syncRoster(id){const t=S.players[id],st=S.stats[id];if(!t||t.test||!st||!db)return;const d={name:t.name,emoji:t.emoji||'',color:t.color||'',st:clone(st),upd:Date.now()};S.roster[id]=d;try{await db.doc('roster/'+id).set(d)}catch(e){}}
function restoreStats(){if(!isOwner||!db||clearing||!LD.stats||!LD.players||!LD.roster)return;
  for(const id of Object.keys(S.players)){if(S.players[id].test||S.stats[id]||tried[id])continue;const r=S.roster[id];if(r&&r.st){tried[id]=1;put('stats',id,clone(r.st))}}}
function showRoster(){const L=Object.entries(S.roster).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
  openS('<h3>База игроков</h3>'+(L.map(([id,r])=>{const h=(r.st||{}).sh||{};return `<div class="dr" onclick="rosterCard('${esc(id)}')"><span class="n">${esc(r.emoji||'')} ${esc(r.name)}</span><span class="mut">${esc([h.cls,h.lvl&&h.lvl+' ур.'].filter(Boolean).join(' '))}${S.players[id]?' · на доске':''}</span></div>`}).join('')||'<p class="mut">Пока пусто. Здесь навсегда сохраняется всё, что вы заполнили для игроков (тест-игроки не считаются).</p>')+'<div class="btns"><button onclick="closeS()">Закрыть</button></div>')}
function rosterCard(id){const r=S.roster[id];if(!r)return;const st=r.st||{},pub=st.sec||{};
  let h=`<h3>${esc(r.emoji||'')} ${esc(r.name)}${st.ini!=null?` <span class="mut">· иниц. ${st.ini}</span>`:''}</h3>`+sheetHTML(st.sh);
  secs('players').forEach(k=>{const L=pub[k]||[];if(L.length)h+=`<h4>${SEC[k]}</h4>`+L.map(i=>`<div class="kv" data-n="${esc(i.n)}" data-v="${esc(i.v)}" onclick="fullView(this)"><span>${esc(i.n)}</span><b>${esc(i.v)}</b></div>`).join('')});
  openS(h+`<div class="btns">${S.players[id]?'':`<button class="on" onclick="restoreTok('${esc(id)}')">Вернуть на доску</button>`}<button onclick="delRoster('${esc(id)}')">Удалить из базы</button><button onclick="showRoster()">Назад</button></div>`)}
function restoreTok(id){const r=S.roster[id];if(!r)return;let c=null;const occ=new Set(all().map(q=>q.x+','+q.y));
  for(let y=0;y<cfg.h&&!c;y++)for(let x=0;x<cfg.w;x++)if(isOn(x,y)&&!occ.has(x+','+y)){c=[x,y];break}
  if(!c){toast('Нет свободных клеток');return}
  tried[id]=1;put('players',id,{name:r.name,emoji:r.emoji,color:r.color,x:c[0],y:c[1]});put('stats',id,clone(r.st));closeS();toast('Возвращён на доску: '+r.name)}
async function delRoster(id){if(!await ask('Удалить из базы навсегда?'))return;delete S.roster[id];if(db){try{await db.doc('roster/'+id).delete()}catch(e){}}showRoster()}
async function clearBoard(){if(!await ask('Очистить доску: убрать все фишки и предметы? Данные игроков останутся в базе.'))return;
  clearing=true;for(const id of Object.keys(S.players))await syncRoster(id);
  for(const c of ['pieces','items','players','stats','secrets']){for(const id of Object.keys(S[c])){if(db){try{await db.doc(c+'/'+id).delete()}catch(e){}}}S[c]={}}
  S.turn={};if(db){try{await db.doc('turn/cur').delete()}catch(e){}}
  clearing=false;tried={};render();toast('Доска очищена')}
let seen=null;const unread={};
const unTot=()=>Object.values(unread).reduce((a,b)=>a+b,0),un=k=>unread[k]?' ('+unread[k]+')':'';
const lrGet=()=>{try{return JSON.parse(localStorage.getItem('bd_lr')||'{}')}catch(e){return{}}};
const lrSet=k=>{try{const o=lrGet();o[k]=Date.now();localStorage.setItem('bd_lr',JSON.stringify(o))}catch(e){}};
function chatNotify(){const me=myId||'demo',ms=Object.entries(S.chat),mine=m=>m.from!==me&&(m.to==='all'||m.to===me),key=m=>m.to==='all'?'all':m.from;
  if(!seen){seen=new Set(ms.map(([id])=>id));const lr=lrGet();if(lr.all===undefined)lrSet('all');
    ms.forEach(([id,m])=>{if(mine(m)&&lr[key(m)]!==undefined&&m.t>lr[key(m)])unread[key(m)]=(unread[key(m)]||0)+1});render();return}
  ms.forEach(([id,m])=>{if(seen.has(id))return;seen.add(id);if(!mine(m))return;
    if((chatOpen||menuOn())&&chatTo===key(m))return;
    unread[key(m)]=(unread[key(m)]||0)+1;toast('💬 '+m.name+': '+m.text);try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}});render()}
const menuOn=()=>(S.sess.cur||{}).open===false;
function setSess(o){put('sess','cur',{open:o})}
async function exitBoard(){if(await ask('Выйти? Все игроки вернутся в главное меню.'))setSess(false)}
function renderMenu(){const m=$('menu');
  if(!m.dataset.init){m.dataset.init=1;m.innerHTML='<div id="mtop"></div><h4 style="color:var(--acc);margin:12px 0 4px">Игроки</h4><div id="ml"></div><h4 style="color:var(--acc);margin:12px 0 4px">Чат</h4><div class="pill" id="cp"></div><div id="cm"></div><div class="snd"><input type="text" id="ci" placeholder="Сообщение" onkeydown="if(event.key===\'Enter\')sendM()"><button class="on" onclick="sendM()">➤</button></div>'}
  $('mtop').innerHTML='<h2 style="margin:6px 0">Главное меню</h2>'+(isOwner?'<div class="bar"><button class="on" onclick="setSess(true)">Открыть доску</button></div>':'<p class="mut">Ведущий вышел с доски. Ожидайте начала.</p>');
  const ids=[...new Set([...Object.keys(S.players).filter(i=>!S.players[i].test),...(isOwner?Object.keys(S.roster):[])])];
  $('ml').innerHTML=ids.map(id=>{const t=S.players[id]||S.roster[id]||{},h=((S.stats[id]||(S.roster[id]||{}).st)||{}).sh||{};
    return `<div class="dr" onclick="menuCard('${esc(id)}')"><span class="n">${esc(t.emoji||'')} ${esc(t.name)}</span><span class="mut">${esc([h.cls,h.lvl&&h.lvl+' ур.',h.ac&&'КД '+h.ac,h.hpm&&'хиты '+(h.hp||0)+'/'+h.hpm].filter(Boolean).join(' · '))}</span></div>`}).join('')||'<span class="mut">Игроков пока нет.</span>'}
function menuCard(id){S.players[id]?showP('players',id):rosterCard(id)}
function testMode(){if(testing){testing=null;isOwner=realOwner;myId=realId;tool=null;render();return}
  const pl=Object.entries(S.players);if(!pl.length){toast('Сначала добавьте игрока: кнопка «＋ Тест-игрок»');return}
  openS('<h3>Режим игрока</h3><p class="mut">Вы увидите доску и права так, как их видит игрок, и сможете ходить за него.</p><label>Играть за<select id="tg">'+pl.map(([id,d])=>`<option value="${esc(id)}">${esc(d.name)}</option>`).join('')+'</select></label><div class="btns"><button class="on" onclick="startTest()">Начать</button><button onclick="closeS()">Отмена</button></div>')}
function startTest(){testing=$('tg').value;isOwner=false;myId=testing;tool=null;closeS();render()}
const itemsAt=(x,y)=>Object.entries(S.items).filter(([,i])=>i.x===x&&i.y===y&&isOn(x,y)).map(([id,i])=>({id,...i}));
const itemMark=(x,y)=>{const it=itemsAt(x,y);return it.length?`<span class="it">${esc(it[0].emoji||'🎁')}${it.length>1?'+':''}</span>`:''};
function editItem(id,x,y){const d=id?S.items[id]:{};E={id,x:x??d.x,y:y??d.y};
  openS(`<h3>${id?'Изменить предмет':'Новый предмет'}<span class="mut" id="svd" style="font-size:12px;font-weight:normal"></span></h3><label>Название<input type="text" id="e-n" value="${esc(d.n)}"></label><div class="r2" style="grid-template-columns:1fr 1fr 1fr"><label>Значок<input type="text" id="e-e" maxlength="2" value="${esc(d.emoji||'🎁')}"></label><label>X<input type="number" id="e-x" min="1" max="${cfg.w}" value="${E.x+1}"></label><label>Y<input type="number" id="e-y" min="1" max="${cfg.h}" value="${E.y+1}"></label></div><label>Описание<textarea id="e-d" rows="5">${esc(d.v)}</textarea></label><div class="btns"><button class="on" onclick="closeS()">Готово</button></div>`);ed='item'}
function saveItem(auto){const cl=(v,m)=>Math.min(m,Math.max(1,parseInt(v)||1))-1,x=cl($('e-x').value,cfg.w),y=cl($('e-y').value,cfg.h),n=$('e-n').value.trim();if(!n)return;
  if(!isOn(x,y)){if(!auto)toast('Эта клетка убрана с доски.');return}
  const id=E.id||'i'+Date.now().toString(36);E.id=id;put('items',id,{n,v:$('e-d').value,emoji:$('e-e').value,x,y});if(auto){const e=$('svd');if(e)e.textContent=' · сохранено ✓'}else{tool=null;closeS()}}
async function delItem(id){if(!await ask('Удалить предмет?'))return;delete S.items[id];render();if(db){try{await db.doc('items/'+id).delete()}catch(e){}}closeS()}
function showCell(x,y){openS('<h3>Предметы в клетке</h3>'+itemsAt(x,y).map(i=>`<div class="kv" data-n="${esc(i.n)}" data-v="${esc(i.v)}" onclick="fullView(this)"><span>${esc(i.emoji||'🎁')} ${esc(i.n)}</span><b>${esc(i.v)}</b></div>${isOwner?`<div class="btns" style="margin:2px 0 6px"><button onclick="editItem('${esc(i.id)}')">Изменить</button><button onclick="delItem('${esc(i.id)}')">Удалить</button></div>`:''}`).join('')+'<div class="btns"><button onclick="closeS()">Закрыть</button></div>')}
render();
(async()=>{try{
  const c=window.claude;if(!c||!c.use)return;
  const [d,u]=await Promise.all([c.use('db'),c.use('user')]);if(!d||!u)return;
  db=d;demo=false;isOwner=await u.isOwner();myId=await u.id();realOwner=isOwner;realId=myId;
  try{myName=(await u.me()).name||myName}catch(e){}
  try{await db.doc('members/'+myId).set({name:myName})}catch(e){}
  ['board','pieces','players','stats','log','members','chat','items','turn','sess'].forEach(sub);if(isOwner){sub('secrets');sub('roster')}render();
}catch(e){}})();
</script></body></html>
